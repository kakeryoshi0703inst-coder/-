<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F2ECE4"/>
    </linearGradient>
    <linearGradient id="sandGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5B8EA6"/>
      <stop offset="100%" stop-color="#417188"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2C2A29" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="url(#bgGrad)" stroke="#E8E2D8" stroke-width="8" filter="url(#shadow)"/>

  <!-- Hourglass Base Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#EBE4D8" stroke-width="4"/>

  <!-- Hourglass Frame Top/Bottom Plates -->
  <rect x="160" y="128" width="192" height="24" rx="12" fill="#5B8EA6"/>
  <rect x="160" y="360" width="192" height="24" rx="12" fill="#5B8EA6"/>

  <!-- Glass Bulbs -->
  <path d="M184 152 C184 220 236 244 256 256 C236 268 184 292 184 360 L328 360 C328 292 276 268 256 256 C276 244 328 220 328 152 Z" 
        fill="#FAF8F5" stroke="#5B8EA6" stroke-width="14" stroke-linejoin="round"/>

  <!-- Sand in Top Bulb -->
  <path d="M200 176 L312 176 C308 206 280 226 256 240 C232 226 204 206 200 176 Z" fill="url(#sandGrad)" opacity="0.85"/>

  <!-- Falling Sand Stream -->
  <line x1="256" y1="244" x2="256" y2="304" stroke="#5B8EA6" stroke-width="6" stroke-linecap="round" stroke-dasharray="10 6"/>

  <!-- Sand Mound in Bottom Bulb -->
  <path d="M214 346 C226 316 286 316 298 346 Z" fill="url(#sandGrad)"/>
</svg>
